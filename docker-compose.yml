services:
  postgres:
    image: postgres:16-alpine
    container_name: insight-postgres
    environment:
      POSTGRES_DB: insight_events
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight123
    ports:
      - "5432:5432"
    volumes:
      - insight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight -d insight_events"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  insight_pgdata:
