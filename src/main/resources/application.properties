spring.application.name=events-api

# ===== Datasource (PostgreSQL en Docker) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/insight_events
spring.datasource.username=insight
spring.datasource.password=insight123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# El schema lo gestiona Flyway, no Hibernate. 'validate' hace que Hibernate
# SOLO verifique que las tablas coinciden con las entidades, sin modificarlas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Logging de SQL (util en desarrollo; se puede apagar en produccion)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway (migraciones) =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
